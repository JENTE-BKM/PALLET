<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파렛트 집계</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--ac:#1f6feb;--bd:#d9dde3;--sum:#e8f0fe;--rd:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eef1f4;--mu:#98a2b0;--ac:#5b9bff;--bd:#343b44;--sum:#22324d;--rd:#ff6b61}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eef1f4;--mu:#98a2b0;--ac:#5b9bff;--bd:#343b44;--sum:#22324d;--rd:#ff6b61}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
h1{font-size:18px;margin:12px 12px 6px}
.date{display:flex;gap:6px;margin:6px;align-items:stretch}
.date input{flex:1;font-size:18px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:10px}
.date button{flex:0 0 52px;padding:0;font-size:20px}
.wrap{overflow-x:auto;margin:0 6px}
table{border-collapse:collapse;width:100%;min-width:340px;background:var(--card)}
th,td{border:1px solid var(--bd);text-align:center;padding:0}
th{background:var(--card);font-size:13px;padding:8px 2px}
td.n{font-weight:700;font-size:13px;color:var(--mu);width:34px}
td input{width:100%;border:0;background:transparent;color:var(--tx);text-align:center;font-size:17px;padding:10px 0;min-width:38px}
td input:focus{outline:2px solid var(--ac);outline-offset:-2px}
td.r{font-weight:700;font-size:16px;padding:10px 2px;background:var(--sum)}
tfoot td{background:var(--sum);font-weight:800;font-size:16px;padding:12px 2px;border-top:2px solid var(--ac)}
.bar{display:flex;gap:8px;margin:12px 6px}
button{flex:1;font-size:15px;padding:14px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.warn{background:var(--rd);color:#fff;border-color:var(--rd);font-weight:700}
#hist{margin:6px;display:none}
#hist .it{display:flex;justify-content:space-between;padding:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;font-size:16px}
#hist .it b{color:var(--ac)}
#hist .it.cur{border-color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:20px}
</style>
</head>
<body>
<h1>📦 파렛트 집계</h1>
<div class="date">
<button id="prev">‹</button>
<input type="date" id="dt">
<button id="next">›</button>
</div>
<div class="wrap"><table>
<thead><tr id="h"></tr></thead>
<tbody id="b"></tbody>
<tfoot><tr id="f"></tr></tfoot>
</table></div>
<div class="bar">
<button class="p" id="add">+ 파렛트 추가</button>
<button id="his">📅 기록</button>
<button id="clr">초기화</button>
</div>
<div id="hist"></div>
<script>
const T=['봉투','극소','소','중','대','이형'];
const blank=()=>Array.from({length:3},()=>Array(6).fill(''));
const v=x=>parseInt(x)||0;
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let data={};
try{data=JSON.parse(localStorage.getItem('pallet2')||'{}')||{}}catch(e){}
let date=fmt(new Date());
try{
  const old=JSON.parse(localStorage.getItem('pallet')||'null');
  if(old&&Array.isArray(old)&&!data[date]){data[date]=old}
}catch(e){}
const save=()=>{try{localStorage.setItem('pallet2',JSON.stringify(data))}catch(e){}};
const rows=()=>data[date]||(data[date]=blank());
const total=r=>r.reduce((a,row)=>a+row.reduce((s,x)=>s+v(x),0),0);
const dt=document.getElementById('dt');
document.getElementById('h').innerHTML='<th>#</th>'+T.map(t=>'<th>'+t+'</th>').join('')+'<th>합계</th>';

function render(){
  dt.value=date;
  const R=rows();
  const b=document.getElementById('b');b.innerHTML='';
  R.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="n">'+(i+1)+'</td>'+r.map((x,j)=>'<td><input type="number" inputmode="numeric" min="0" data-i="'+i+'" data-j="'+j+'" value="'+x+'"></td>').join('')+'<td class="r" id="r'+i+'"></td>';
    b.appendChild(tr);
  });
  sums();
}
function sums(){
  const R=rows();
  R.forEach((r,i)=>{const e=document.getElementById('r'+i);if(e)e.textContent=r.reduce((a,x)=>a+v(x),0)});
  const c=T.map((_,j)=>R.reduce((a,r)=>a+v(r[j]),0));
  document.getElementById('f').innerHTML='<td>합계</td>'+c.map(x=>'<td>'+x+'</td>').join('')+'<td>'+c.reduce((a,x)=>a+x,0)+'</td>';
}
function go(d){date=d;armed=false;resetBtn();render();if(hist.style.display==='block')showHist()}
function shift(n){
  const p=date.split('-').map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  go(fmt(d));
}
document.getElementById('b').addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.i)return;
  rows()[t.dataset.i][t.dataset.j]=t.value;save();sums();
});
document.getElementById('add').onclick=()=>{rows().push(Array(6).fill(''));save();render();window.scrollTo(0,document.body.scrollHeight)};
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
dt.onchange=()=>{if(dt.value)go(dt.value)};

let armed=false,timer=null;
const clr=document.getElementById('clr');
function resetBtn(){clearTimeout(timer);clr.textContent='초기화';clr.className=''}
clr.onclick=()=>{
  if(!armed){armed=true;clr.textContent='한 번 더 누르면 삭제';clr.className='warn';timer=setTimeout(()=>{armed=false;resetBtn()},3000);return}
  armed=false;resetBtn();delete data[date];save();render();if(hist.style.display==='block')showHist();
};

const hist=document.getElementById('hist');
function showHist(){
  const keys=Object.keys(data).filter(k=>total(data[k])>0).sort().reverse();
  hist.innerHTML=keys.length?keys.map(k=>'<div class="it'+(k===date?' cur':'')+'" data-d="'+k+'"><span>'+k+' · '+data[k].length+'파렛트</span><b>'+total(data[k])+'개</b></div>').join(''):'<div class="empty">저장된 기록이 없어요</div>';
  hist.style.display='block';
}
document.getElementById('his').onclick=()=>{
  if(hist.style.display==='block'){hist.style.display='none'}else{showHist();hist.scrollIntoView({behavior:'smooth'})}
};
hist.onclick=e=>{
  const it=e.target.closest('.it');if(!it)return;
  go(it.dataset.d);hist.style.display='none';window.scrollTo(0,0);
};
render();
</script>
</body>
</html>
