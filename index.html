<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔레트 집계</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--ac:#1f6feb;--bd:#d9dde3;--sum:#e8f0fe;--rd:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eef1f4;--mu:#98a2b0;--ac:#5b9bff;--bd:#343b44;--sum:#22324d;--rd:#ff6b61}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eef1f4;--mu:#98a2b0;--ac:#5b9bff;--bd:#343b44;--sum:#22324d;--rd:#ff6b61}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
h1{font-size:18px;margin:12px 12px 6px}
.date{display:flex;gap:6px;margin:6px;align-items:stretch}
.dtbox{flex:1;min-width:0;position:relative;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.dtbox #dtl{display:block;text-align:center;font-size:18px;font-weight:600;padding:12px 6px;color:var(--tx);white-space:nowrap}
.dtbox #dtl.red{color:var(--rd)}
.dtbox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;margin:0}
.date button{flex:0 0 52px;padding:0;font-size:20px}
.red{color:var(--rd)}
#hist .it i{font-style:normal}
.loose{display:flex;gap:6px;margin:6px}
.loose label{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mu);min-width:0}
.loose input{display:block;width:100%;border:0;background:transparent;color:var(--tx);font-size:19px;font-weight:700;padding:4px 0;min-width:0}
.loose input:focus{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
.wrap{overflow-x:auto;margin:8px 6px 0}
table{border-collapse:collapse;width:100%;min-width:320px;table-layout:fixed;background:var(--card)}
th,td{border:1px solid var(--bd);text-align:center;padding:0}
th{background:var(--card);font-size:13px;padding:8px 0;white-space:nowrap}
td.n{font-weight:700;font-size:13px;color:var(--mu)}
td input{width:100%;min-width:0;border:0;background:transparent;color:var(--tx);text-align:center;font-size:16px;padding:10px 0}
td input:focus{outline:2px solid var(--ac);outline-offset:-2px}
td.r{font-weight:800;font-size:18px;padding:10px 2px;background:var(--sum)}
tfoot td{background:var(--sum);font-weight:800;font-size:15px;padding:12px 0;border-top:2px solid var(--ac);white-space:nowrap}
tfoot td:first-child{font-size:12px}
.addrow td{padding:0}
.addrow button{display:block;width:100%;flex:none;padding:7px 0;font-size:22px;font-weight:700;line-height:1;border:0;border-radius:0;background:var(--card);color:var(--ac)}
.addrow button#del{color:var(--rd);font-size:20px}
.addrow button#del:disabled{opacity:.3}
.addrow button#del.warn{background:var(--rd);color:#fff;font-size:13px;padding:10px 0}
.sumcard{margin:8px 6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--mu)}
.sumcard div{display:flex;justify-content:space-between;padding:3px 0}
.sumcard .g{border-top:2px solid var(--ac);margin-top:6px;padding-top:8px;color:var(--tx);font-size:20px;font-weight:800}
.sumcard .x{font-size:13px}
.sumcard .g span:last-child{color:var(--ac)}
.bar{display:flex;gap:8px;margin:12px 6px}
button{flex:1;font-size:15px;padding:14px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
button.warn{background:var(--rd);color:#fff;border-color:var(--rd);font-weight:700}
#hist{margin:6px 6px 24px}
.hh{font-size:16px;margin:18px 12px 6px}
#hist .it{display:flex;justify-content:space-between;padding:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--bd);border-radius:10px;font-size:16px}
#hist .it b{color:var(--ac)}
#hist .it.cur{border-color:var(--ac)}
#hist .grp{margin-bottom:10px}
#hist .gh{display:flex;justify-content:space-between;align-items:center;padding:14px;margin-bottom:6px;background:var(--sum);border-radius:10px;font-size:16px;font-weight:700}
#hist .gh b{color:var(--ac)}
#hist .it{margin-left:12px}
.msg{margin:0 12px;min-height:20px;font-size:14px;font-weight:600}
.empty{color:var(--mu);text-align:center;padding:20px}
</style>
</head>
<body>
<h1>📦 팔레트 집계</h1>
<div class="date">
<button id="prev">‹</button>
<div class="dtbox"><div id="dtl"></div><input type="date" id="dt"></div>
<button id="next">›</button>
</div>
<div class="loose">
<label>봉투 1zone<input type="number" inputmode="numeric" min="0" id="bag1" placeholder="0"></label>
<label>봉투 2zone<input type="number" inputmode="numeric" min="0" id="bag2" placeholder="0"></label>
<label>마대자루<input type="number" inputmode="numeric" min="0" id="sack" placeholder="0"></label>
<label>테이프<input type="number" inputmode="numeric" min="0" id="tape" placeholder="0"></label>
</div>
<div class="wrap"><table>
<colgroup><col style="width:38px"><col><col><col><col><col><col style="width:24%"></colgroup>
<thead><tr id="h"></tr></thead>
<tbody id="b"></tbody>
<tfoot><tr id="f"></tr></tfoot>
</table></div>
<div class="sumcard" id="sc"></div>
<div class="bar">
<button id="bk">💾 백업 저장</button>
<button id="im">📂 불러오기</button>
<button id="clr">초기화</button>
</div>
<div id="msg" class="msg"></div>
<input type="file" id="file" accept=".txt,.json,text/plain,application/json" style="display:none">
<h2 class="hh">📅 기록</h2>
<div id="hist"></div>
<script>
const T=['극소','소','중','대','이형'];
const N=T.length;
const blank=()=>({rows:[Array(N).fill('')],bag1:'',bag2:'',sack:'',tape:''});
const v=x=>parseInt(x)||0;
const pad=n=>String(n).padStart(2,'0');
// 공휴일: 매년 같은 날짜 + 설날·추석·부처님오신날·선거일·대체공휴일(2026~2027)
const FIXED=new Set(['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25']);
const HOL=new Set([
 '2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-25','2026-06-03','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-05',
 '2027-02-05','2027-02-06','2027-02-07','2027-02-08','2027-05-13','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11'
]);
function isRed(ds){
  const p=ds.split('-').map(Number);
  const w=new Date(p[0],p[1]-1,p[2]).getDay();
  return w===0||w===6||FIXED.has(ds.slice(5))||HOL.has(ds);
}
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const palletSum=r=>r.rows.reduce((a,row)=>a+row.reduce((s,x)=>s+v(x),0),0);
const total=r=>palletSum(r)+v(r.bag1)+v(r.bag2);
const hasData=r=>!!r&&((r.rows||[]).some(row=>row.some(x=>String(x==null?'':x)!==''))||['bag1','bag2','sack','tape'].some(k=>String(r[k]==null?'':r[k])!==''));

let data={};
try{data=JSON.parse(localStorage.getItem('pallet3')||'{}')||{}}catch(e){}
// 이전 버전(봉투가 표 안에 있던 형식)에서 가져오기
try{
  const old=JSON.parse(localStorage.getItem('pallet2')||'null');
  if(old&&typeof old==='object'&&!Object.keys(data).length){
    Object.keys(old).forEach(k=>{
      const rs=old[k];if(!Array.isArray(rs))return;
      data[k]={rows:rs.map(r=>r.slice(1)),bag1:String(rs.reduce((a,r)=>a+v(r[0]),0)||''),bag2:'',sack:''};
    });
  }
}catch(e){}
// 봉투 한 칸 → 1zone/2zone 두 칸으로 바뀐 이전 기록 옮기기
Object.keys(data).forEach(k=>{const r=data[k];if(r&&'bag' in r&&!('bag1' in r)){r.bag1=r.bag;r.bag2='';delete r.bag}});
let date=fmt(new Date());
const save=()=>{try{Object.keys(data).forEach(k=>{if(k!==date&&!hasData(data[k]))delete data[k]});localStorage.setItem('pallet3',JSON.stringify(data))}catch(e){}};
const rec=()=>data[date]||(data[date]=blank());
const dt=document.getElementById('dt');
const hist=document.getElementById('hist');
document.getElementById('h').innerHTML='<th>#</th>'+T.map(t=>'<th>'+t+'</th>').join('')+'<th>합계</th>';

function render(){
  dt.value=date;
  const dp=date.split('-').map(Number);
  const dl=document.getElementById('dtl');
  dl.textContent=dp[0]+'년 '+dp[1]+'월 '+dp[2]+'일 ('+'일월화수목금토'[new Date(dp[0],dp[1]-1,dp[2]).getDay()]+')';
  dl.classList.toggle('red',isRed(date));
  const R=rec();
  document.getElementById('bag1').value=R.bag1;
  document.getElementById('bag2').value=R.bag2;
  document.getElementById('sack').value=R.sack||'';
  document.getElementById('tape').value=R.tape||'';
  const b=document.getElementById('b');b.innerHTML='';
  R.rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="n">'+(i+1)+'</td>'+r.map((x,j)=>'<td><input type="number" inputmode="numeric" min="0" data-i="'+i+'" data-j="'+j+'" value="'+x+'"></td>').join('')+'<td class="r" id="r'+i+'"></td>';
    b.appendChild(tr);
  });
  const ar=document.createElement('tr');
  ar.className='addrow';
  delArmed=false;clearTimeout(delTimer);
  ar.innerHTML='<td colspan="'+(N+1)+'"><button id="add" aria-label="팔레트 추가">＋</button></td><td><button id="del" aria-label="마지막 팔레트 삭제"'+(R.rows.length<=1?' disabled':'')+'>－</button></td>';
  b.appendChild(ar);
  sums();
}
function sums(){
  const R=rec();
  R.rows.forEach((r,i)=>{const e=document.getElementById('r'+i);if(e)e.textContent=r.reduce((a,x)=>a+v(x),0)});
  const c=T.map((_,j)=>R.rows.reduce((a,r)=>a+v(r[j]),0));
  const ps=palletSum(R);
  document.getElementById('f').innerHTML='<td>합계</td>'+c.map(x=>'<td>'+x+'</td>').join('')+'<td>'+total(R)+'</td>';
  document.getElementById('sc').innerHTML=
    '<div><span>팔레트 합계 ('+R.rows.length+'개)</span><span>'+ps+'</span></div>'+
    '<div><span>봉투 합계</span><span>'+(v(R.bag1)+v(R.bag2))+'</span></div>'+
    '<div class="g"><span>총합산</span><span>'+total(R)+'</span></div>'+
    '<div class="x"><span>마대자루 (합산 제외)</span><span>'+v(R.sack)+'</span></div>'+
    '<div class="x"><span>테이프 (합산 제외)</span><span>'+v(R.tape)+'</span></div>';
  showHist();
}
function go(d){date=d;armed=false;resetBtn();render()}
function shift(n){
  const p=date.split('-').map(Number);
  go(fmt(new Date(p[0],p[1]-1,p[2]+n)));
}
document.getElementById('b').addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.i)return;
  rec().rows[t.dataset.i][t.dataset.j]=t.value;save();sums();
});
document.getElementById('bag1').addEventListener('input',e=>{rec().bag1=e.target.value;save();sums()});
document.getElementById('bag2').addEventListener('input',e=>{rec().bag2=e.target.value;save();sums()});
document.getElementById('sack').addEventListener('input',e=>{rec().sack=e.target.value;save();sums()});
document.getElementById('tape').addEventListener('input',e=>{rec().tape=e.target.value;save();sums()});
let delArmed=false,delTimer=null;
document.getElementById('b').addEventListener('click',e=>{
  const db=e.target.closest('#del');
  if(db){
    const R=rec();
    if(R.rows.length<=1)return;
    const filled=R.rows[R.rows.length-1].some(x=>x!=='');
    if(filled&&!delArmed){
      delArmed=true;db.textContent='한 번 더';db.classList.add('warn');
      delTimer=setTimeout(()=>{delArmed=false;const b=document.getElementById('del');if(b){b.textContent='－';b.classList.remove('warn')}},3000);
      return;
    }
    R.rows.pop();save();render();
    return;
  }
  if(!e.target.closest('#add'))return;
  const R=rec();R.rows.push(Array(N).fill(''));save();render();
  const f=document.querySelector('#b input[data-i="'+(R.rows.length-1)+'"][data-j="0"]');
  if(f)f.focus();
});
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
dt.onchange=()=>{if(dt.value)go(dt.value)};
dt.addEventListener('click',()=>{try{dt.showPicker()}catch(e){}});

let armed=false,timer=null;
const clr=document.getElementById('clr');
function resetBtn(){clearTimeout(timer);clr.textContent='초기화';clr.className=''}
clr.onclick=()=>{
  if(!armed){armed=true;clr.textContent='한 번 더 눌러 삭제';clr.className='warn';timer=setTimeout(()=>{armed=false;resetBtn()},3000);return}
  armed=false;resetBtn();delete data[date];save();render();
};

const openM=new Set();
let lastM=null;
const WD='일월화수목금토';
function showHist(){
  const keys=Object.keys(data).filter(k=>total(data[k])>0).sort().reverse();
  if(!keys.length){hist.innerHTML='<div class="empty">저장된 기록이 없어요</div>';return}
  const groups={};
  keys.forEach(k=>{const m=k.slice(0,7);(groups[m]=groups[m]||[]).push(k)});
  const cur=date.slice(0,7);
  if(cur!==lastM){openM.add(cur);lastM=cur}
  hist.innerHTML=Object.keys(groups).sort().reverse().map(m=>{
    const ks=groups[m];
    const sum=ks.reduce((a,k)=>a+total(data[k]),0);
    const op=openM.has(m);
    const items=op?ks.map(k=>{
      const p=k.split('-').map(Number);
      const lab=p[1]+'월 '+p[2]+'일 ('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+')';
      return '<div class="it'+(k===date?' cur':'')+'" data-d="'+k+'"><span><i class="'+(isRed(k)?'red':'')+'">'+lab+'</i> · '+data[k].rows.length+'팔레트</span><b>'+total(data[k])+'개</b></div>';
    }).join(''):'';
    return '<div class="grp"><div class="gh" data-m="'+m+'"><span>'+(op?'📂':'📁')+' '+m.slice(0,4)+'년 '+Number(m.slice(5))+'월</span><span>'+ks.length+'일 · <b>'+sum+'개</b></span></div>'+items+'</div>';
  }).join('');
}
hist.onclick=e=>{
  const gh=e.target.closest('.gh');
  if(gh){const m=gh.dataset.m;if(openM.has(m))openM.delete(m);else openM.add(m);showHist();return}
  const it=e.target.closest('.it');if(!it)return;
  go(it.dataset.d);window.scrollTo({top:0,behavior:'smooth'});
};
const msg=document.getElementById('msg');
const say=(t,bad)=>{msg.textContent=t;msg.style.color=bad?'var(--rd)':'var(--ac)'};
document.getElementById('bk').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'pallet',v:3,saved:fmt(new Date()),data:Object.fromEntries(Object.entries(data).filter(([k,r])=>hasData(r)))})],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pallet-backup-'+fmt(new Date())+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  say('백업 파일을 저장했어요. 내 파일 > 다운로드 폴더를 확인하세요.');
};
const fileEl=document.getElementById('file');
document.getElementById('im').onclick=()=>fileEl.click();
fileEl.onchange=()=>{
  const f=fileEl.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);
      if(!o||o.app!=='pallet'||typeof o.data!=='object')throw 0;
      let n=0;
      Object.keys(o.data).forEach(k=>{
        const r=o.data[k];
        if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&r&&Array.isArray(r.rows)){
          let rows=r.rows.map(x=>Array.from({length:N},(_,j)=>x&&x[j]!=null?String(x[j]):''));
          if(!rows.length)rows=[Array(N).fill('')];
          const nr={rows:rows,bag1:r.bag1||'',bag2:r.bag2||'',sack:r.sack||'',tape:r.tape||''};
          if(hasData(nr)){data[k]=nr;n++}
        }
      });
      save();render();say(n?n+'일치 기록을 불러왔어요. (같은 날짜는 파일 내용으로 바뀌었어요)':'불러올 입력 기록이 없는 파일이에요.',!n);
    }catch(e){say('불러올 수 없는 파일이에요.',true)}
    fileEl.value='';
  };
  rd.readAsText(f);
};
render();
</script>
</body>
</html>
